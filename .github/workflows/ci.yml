name: CI

on:
  push:
    branches: [main]
  pull_request:

# O CI só lê o código: nenhum token com permissão de escrita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (modo demo, sem nenhuma chave)
        run: npm run build
        env:
          NEXT_PUBLIC_MODO: demo

  banco:
    name: Supabase local (migrações, advisor e contrato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Os testes do npm test rodam num Postgres em memória; aqui as mesmas
      # migrações sobem no Supabase de verdade. Só banco, Auth e API: o resto
      # (Studio, Storage, Realtime...) não entra.
      - name: Subir o Supabase local e aplicar as migrações
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Advisor de segurança do Supabase
        run: npx supabase db advisors --type security --fail-on warn

      # A mesma suíte de contrato da demo, agora contra o RepositorioSupabase,
      # com login de verdade, RLS e FKs compostas valendo; e o login por convite
      # de ponta a ponta (hook do Auth, convite virando membro, seed). Um
      # arquivo por vez: o teste do seed limpa as famílias antes de rodar.
      - name: Testes no Supabase local (contrato e login por convite)
        run: |
          npx supabase status -o env | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          export SUPABASE_TESTE_URL="$API_URL"
          export SUPABASE_TESTE_CHAVE_PUBLICA="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_TESTE_CHAVE_SECRETA="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          : "${SUPABASE_TESTE_URL:?o supabase status não deu a URL da API}"
          : "${SUPABASE_TESTE_CHAVE_PUBLICA:?o supabase status não deu a chave pública}"
          : "${SUPABASE_TESTE_CHAVE_SECRETA:?o supabase status não deu a chave secreta}"
          npx vitest run tests/contrato/supabase.test.ts tests/supabase --no-file-parallelism
