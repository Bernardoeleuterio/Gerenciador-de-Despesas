name: CI

on:
  push:
    branches: [main]
  pull_request:

# O CI só lê o código: nenhum token com permissão de escrita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (modo demo, sem nenhuma chave)
        run: npm run build
        env:
          NEXT_PUBLIC_MODO: demo
